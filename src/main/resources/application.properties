spring.application.name=centauro-billing
server.port=${PORT:8087}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Argentina/Buenos_Aires

management.endpoints.web.exposure.include=health,info
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

jwt.secret=${JWT_SECRET}
url.front=${URL_FRONT:}

billing.zone=America/Argentina/Buenos_Aires
billing.internal.api-key=${BILLING_INTERNAL_API_KEY}
billing.public-base-url=${BILLING_PUBLIC_BASE_URL:}
billing.trial.days=${BILLING_TRIAL_DAYS:14}
billing.trial.plan-code=${BILLING_TRIAL_PLAN_CODE:PROFESIONAL}
billing.trial.grace-days=${BILLING_TRIAL_GRACE_DAYS:3}
billing.grace.days=${BILLING_GRACE_DAYS:7}
billing.checkout.expiration-hours=${BILLING_CHECKOUT_EXPIRATION_HOURS:48}
billing.checkout.back-url=${BILLING_CHECKOUT_BACK_URL:}
billing.jobs.enabled=${BILLING_JOBS_ENABLED:true}
billing.jobs.lifecycle-cron=0 */15 * * * *
billing.jobs.checkout-expiration-cron=${BILLING_JOBS_CHECKOUT_EXPIRATION_CRON:0 0 * * * *}
billing.jobs.webhook-retry-cron=${BILLING_JOBS_WEBHOOK_RETRY_CRON:0 */5 * * * *}
billing.jobs.reconciliation-cron=${BILLING_JOBS_RECONCILIATION_CRON:0 30 4 * * *}
billing.jobs.webhook-max-attempts=${BILLING_WEBHOOK_MAX_ATTEMPTS:10}
billing.jobs.reconciliation-max-items=${BILLING_RECONCILIATION_MAX_ITEMS:2000}
billing.jobs.reconciliation-max-minutes=${BILLING_RECONCILIATION_MAX_MINUTES:20}

billing.mercadopago.base-url=https://api.mercadopago.com
billing.mercadopago.access-token=${MP_ACCESS_TOKEN:}
billing.mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
billing.mercadopago.webhook.require-signature=${MP_WEBHOOK_REQUIRE_SIGNATURE:true}
billing.mercadopago.webhook.max-skew-seconds=${MP_WEBHOOK_MAX_SKEW_SECONDS:300}
billing.mercadopago.webhook.max-body-bytes=${MP_WEBHOOK_MAX_BODY_BYTES:65536}
billing.mercadopago.connect-timeout-ms=${MP_CONNECT_TIMEOUT_MS:5000}
billing.mercadopago.read-timeout-ms=${MP_READ_TIMEOUT_MS:15000}

logging.level.com.centauro.billing=INFO
